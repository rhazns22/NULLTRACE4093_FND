name: Deploy frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source payload
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find payload -maxdepth 1 -name 'nulltrace-source.tgz.b64.part-*' | sort -V)
          test "${#parts[@]}" -eq 8
          cat "${parts[@]}" | tr -d '\r\n' > /tmp/nulltrace-source.tgz.b64
          test "$(wc -c < /tmp/nulltrace-source.tgz.b64)" -gt 30000
          base64 --decode /tmp/nulltrace-source.tgz.b64 > /tmp/nulltrace-source.tgz
          mkdir -p /tmp/nulltrace-src
          tar -xzf /tmp/nulltrace-source.tgz -C /tmp/nulltrace-src
          cp -R /tmp/nulltrace-src/. .
          test -f package.json
          test -f src/main.tsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
